      const list=ensureCategories();
      $$('[data-cat-name]').forEach(el=>{const c=list.find(x=>x.slug===el.dataset.catName);if(c)c.zh=el.value.trim()||c.zh});
      $$('[data-cat-count]').forEach(el=>{const c=list.find(x=>x.slug===el.dataset.catCount);if(c)c.count=Math.max(0,parseInt(el.value,10)||0)});
      $$('[data-cat-visible]').forEach(el=>{const c=list.find(x=>x.slug===el.dataset.catVisible);if(c)c.visible=el.checked});
      log('更新筛选设置（二级选项展示 '+lim+' 项）');save();toast('分类设置已保存');render();break}
    case 'addcat':{
      const name=$('#nc-name').value.trim();if(!name){toast('请填写分类名称');break}
      const slug=slugify(name)||('cat-'+Date.now().toString(36));
      if(DB.categories.some(c=>c.slug===slug)){toast('该分类已存在');break}
      DB.categories.push({id:uid(),slug,name,zh:name,icon:'IconGrid',visible:true,
        count:Math.max(0,parseInt($('#nc-count').value,10)||0),order:DB.categories.length});
      log('新增分类：'+name);save();toast('已新增分类');render();break}
    case 'delcat':{
      const c=DB.categories.find(x=>x.slug===v);if(!c)break;
      if(!window.confirm('确定删除分类「'+(c.zh||c.name)+'」？已上传的图标不会被删除。'))break;
      DB.categories=DB.categories.filter(x=>x.slug!==v);
      log('删除分类：'+v);save();toast('已删除分类');render();break}
    case 'resetcats':{DB.categories=clone(SITE.categories);DB.settings.homeCategoryCount=8;ensureCategories();log('恢复默认分类设置');save();toast('已恢复默认分类');render();break}
    case 'catup':case 'catdown':{
      const list=ensureCategories().slice().sort((x,y)=>(x.order||0)-(y.order||0));
      const i=list.findIndex(c=>c.slug===v),j=a==='catup'?i-1:i+1;
      if(i<0||j<0||j>=list.length)break;
      [list[i],list[j]]=[list[j],list[i]];list.forEach((c,k)=>c.order=k);
      log('调整分类排序：'+v);save();render();break}
    case 'savestylesettings':{
      const list=ensureStyles();
      $$('[data-st-name]').forEach(el=>{const s=list.find(x=>x.slug===el.dataset.stName);if(s)s.zh=el.value.trim()||s.zh});
      $$('[data-st-count]').forEach(el=>{const s=list.find(x=>x.slug===el.dataset.stCount);if(s)s.count=Math.max(0,parseInt(el.value,10)||0)});
      $$('[data-st-visible]').forEach(el=>{const s=list.find(x=>x.slug===el.dataset.stVisible);if(s)s.visible=el.checked});
      log('更新风格设置');save();toast('风格设置已保存');render();break}
    case 'addstyle':{
      const name=$('#ns-name').value.trim();if(!name){toast('请填写风格名称');break}
      const slug=slugify(name)||safeSlug(name,'style');
      if(DB.styles.some(s=>s.slug===slug)){toast('该风格已存在');break}
      DB.styles.push({id:uid(),slug,name,zh:name,visible:true,
        count:Math.max(0,parseInt($('#ns-count').value,10)||0),order:DB.styles.length});
      log('新增风格：'+name);save();toast('已新增风格');render();break}
    case 'delstyle':{
      const s=DB.styles.find(x=>x.slug===v);if(!s)break;
      if(!window.confirm('确定删除风格「'+(s.zh||s.name)+'」？已使用该风格的图标会变成「未设置风格」，图标本身不会被删除。'))break;
      DB.styles=DB.styles.filter(x=>x.slug!==v);
      for(const a of DB.apps)for(const ic of a.icons)if(iconStyles(ic).includes(v))setIconStyles(ic,iconStyles(ic).filter(x=>x!==v));
      log('删除风格：'+v);save();toast('已删除风格');render();break}
    case 'resetstyles':{
      if(!window.confirm('恢复 12 种默认风格？已标注的图标风格不会清除。'))break;
      DB.styles=clone(STYLE_DEFAULT);log('恢复默认风格');save();toast('已恢复默认风格');render();break}
    case 'styleup':case 'styledown':{
      const list=ensureStyles().slice().sort((x,y)=>(x.order||0)-(y.order||0));
      const i=list.findIndex(s=>s.slug===v),j=a==='styleup'?i-1:i+1;
      if(i<0||j<0||j>=list.length)break;
      [list[i],list[j]]=[list[j],list[i]];list.forEach((s,k)=>s.order=k);
      log('调整风格排序：'+v);save();render();break}
    case 'batchstyle':{
      const q=String($('#bs-q')?.value||'').trim().toLowerCase();
      const arr=checkedValues('bs-styles');
      const onlyNone=!!$('#bs-none-only')?.checked;
      const label=arr.length?arr.map(styleName).filter(Boolean).join('、'):'未设置风格';
      if(!window.confirm('确定把匹配的图标设为「'+label+'」吗？'))break;
      let n=0;
      for(const ap of DB.apps){
        if(q&&!ap.app.name.toLowerCase().includes(q)&&!ap.app.slug.toLowerCase().includes(q))continue;
        for(const ic of ap.icons){
          if(onlyNone&&arr.length&&iconStyles(ic).length)continue;
          setIconStyles(ic,arr);n++;
        }
      }
      if(!n){toast('没有匹配的图标');break}
      log('批量设置风格：'+n+' 枚图标');save();toast('已更新 '+n+' 枚图标的风格');render();break}
    case 'savetypesettings':{
      const list=ensureTypes();
      $$('[data-ty-name]').forEach(el=>{const t=list.find(x=>x.slug===el.dataset.tyName);if(t)t.zh=el.value.trim()||t.zh});
      $$('[data-ty-visible]').forEach(el=>{const t=list.find(x=>x.slug===el.dataset.tyVisible);if(t)t.visible=el.checked});
      log('更新类型设置');save();toast('类型设置已保存');render();break}
    case 'addtype':{
      const name=$('#nt-name').value.trim();if(!name){toast('请填写类型名称');break}
      const slug=slugify(name)||safeSlug(name,'type');
      if(DB.types.some(t=>t.slug===slug)){toast('该类型已存在');break}
      DB.types.push({id:uid(),slug,name,zh:name,visible:true,count:0,order:DB.types.length});
      log('新增类型：'+name);save();toast('已新增类型');render();break}
    case 'deltype':{
      const t=DB.types.find(x=>x.slug===v);if(!t)break;
      if(DB.types.length<=1){toast('至少保留一种类型');break}
      const fallback=defaultTypeSlug()===v
        ? (ensureTypes().find(x=>x.slug!==v)?.slug||'ios') : defaultTypeSlug();
      if(!window.confirm('确定删除类型「'+(t.zh||t.name)+'」？使用该类型的图标会改为「'+typeName(fallback)+'」，图标本身不会被删除。'))break;
      DB.types=DB.types.filter(x=>x.slug!==v);
      for(const ap of DB.apps)for(const ic of ap.icons)if(ic.platform===v)ic.platform=fallback;
      log('删除类型：'+v);save();toast('已删除类型');render();break}
    case 'resettypes':{
      if(!window.confirm('恢复为 iOS / macOS 两种默认类型？已新增的类型会被移除，图标不会被删除。'))break;
      DB.types=clone(TYPE_DEFAULT);
      const valid=new Set(DB.types.map(t=>t.slug));
      for(const ap of DB.apps)for(const ic of ap.icons)if(!valid.has(ic.platform))ic.platform='ios';
      log('恢复默认类型');save();toast('已恢复默认类型');render();break}
    case 'typeup':case 'typedown':{
      const list=ensureTypes().slice().sort((x,y)=>(x.order||0)-(y.order||0));
      const i=list.findIndex(t=>t.slug===v),j=a==='typeup'?i-1:i+1;
      if(i<0||j<0||j>=list.length)break;
      [list[i],list[j]]=[list[j],list[i]];list.forEach((t,k)=>t.order=k);
      log('调整类型排序：'+v);save();render();break}
    case 'batchtype':{
      const q=String($('#bt-q')?.value||'').trim().toLowerCase();
      const t=$('#bt-type')?.value||'';
      if(!t||!ensureTypes().some(x=>x.slug===t)){toast('所选类型无效');break}
      if(!window.confirm('确定把匹配应用的图标类型设为「'+typeName(t)+'」吗？'))break;
      let n=0;
      for(const ap of DB.apps){
        if(q&&!ap.app.name.toLowerCase().includes(q)&&!ap.app.slug.toLowerCase().includes(q))continue;
        for(const ic of ap.icons){ic.platform=t;n++}
      }
      if(!n){toast('没有匹配的应用');break}
      log('批量设置类型：'+n+' 枚图标');save();toast('已更新 '+n+' 枚图标的类型');render();break}
    case 'adddesigner':{
      const name=$('#nd-name').value.trim();if(!name){toast('请填写设计师姓名');break}
      const slug=safeSlug(name,'designer');
      if(DB.designers.some(d=>d.slug===slug)){toast('该设计师已存在');break}
      DB.designers.unshift({id:uid(),slug,name,avatarUrl:'',twitter:$('#nd-social').value.trim(),website:'',count:0});
      log('新增设计师：'+name);save();toast('已新增设计师');render();break}
    case 'savedesigner':{
      const d=DB.designers.find(x=>x.slug===v);if(!d)break;
      const nm=($('[data-ds-name="'+v+'"]')?.value||'').trim();if(!nm){toast('姓名不能为空');break}
      d.name=nm;d.twitter=$('[data-ds-social="'+v+'"]').value.trim();d.website=cleanUrl($('[data-ds-site="'+v+'"]').value);
      for(const a of DB.apps)for(const ic of a.icons)if(ic.designer?.slug===v)ic.designer={...ic.designer,name:d.name,twitter:d.twitter,website:d.website};
      log('更新设计师资料：'+d.name);save();toast('设计师资料已保存');render();break}
    case 'deletedesigner':{
      if(!window.confirm('确定删除该设计师？相关图标的署名会一并清除。'))break;
      const d=DB.designers.find(x=>x.slug===v);if(!d)break;
      DB.designers=DB.designers.filter(x=>x.slug!==v);
      for(const a of DB.apps)for(const ic of a.icons)if(ic.designer?.slug===v)ic.designer=null;
      log('删除设计师：'+d.name);save();toast('已删除设计师');render();break}
    case 'purgehd':{
      if(!window.confirm('确定清理全部高清原图？缩略图与馆藏会保留，但之后下载的 1024 图将从缩略图放大。'))break;
      let n=0;for(const a of DB.apps)for(const ic of a.icons)if(ic.hdUrl){delete ic.hdUrl;n++}
      save();log('清理高清原图 '+n+' 枚');toast('已释放 '+n+' 枚高清原图的空间');render();break}
    case 'fillpalettes':fillMissingPalettes();break;
    case 'changepass':{
      const old=$('#pw-old').value,neu=$('#pw-new').value,cf=$('#pw-confirm').value;
      if(old!==adminPass()){toast('当前密码不正确');break}
      if(neu.length<6){toast('新密码至少需要 6 位');break}
      if(neu!==cf){toast('两次输入的新密码不一致');break}
      if(neu===old){toast('新密码不能与当前密码相同');break}
      setAdminPass(neu);log('修改后台登录密码');save();toast('密码已修改，下次登录请使用新密码');render();break}
    case 'resetpass':{
      if(window.confirm('确定恢复默认密码 museum2026 吗？')){setAdminPass(DEFAULT_PASS);log('恢复默认登录密码');save();toast('已恢复默认密码');render()}
      break}
    case 'saveabout':{
      const ed=$('#about-editor');
      if(!ed){toast('编辑器未就绪，请重新打开本页');break}
      const doc=String(ed.value||'').replace(/\r\n?/g,'\n').trimEnd();
      if(!doc.trim()){toast('请填写关于页面内容后再保存');break}
      DB.about=aboutFieldsFromDoc(doc);
      log('更新关于页面文案（整篇文档）');save();toast('关于页面已更新');render();break}
    case 'resetabout':{
      if(window.confirm('确定恢复关于页面的默认文案吗？')){DB.about=clone(ABOUT_DEFAULT);log('恢复关于页面默认文案');save();toast('已恢复默认文案');render()}
      break}
    case 'exportaboutdoc':{
      const ed=$('#about-editor');if(!ed)break;
      download('about.md',String(ed.value||'').replace(/\r\n?/g,'\n').trimEnd()+'\n','text/markdown');
      toast('已导出 about.md，放到项目目录即可同步到站点包');break}
    case 'uploadlogo':{
      const f=$('#st-logo')?.files[0];if(!f){toast('请先选择 Logo 图片');break}
      compressLogo(f).then(url=>{DB.settings.brandLogo=url;log('更新网站 Logo');save();toast('Logo 已更新');render()}).catch(()=>toast('图片读取失败，请换一张图片'));
      break}
    case 'resetlogo':{DB.settings.brandLogo=DEFAULT_BRAND_LOGO;log('恢复默认网站 Logo');save();toast('已恢复默认 Logo');render();break}
    case 'cmsretry':{
      el.disabled=true;el.textContent='正在重试…';
      probeCMS().then(()=>{if(isAdminPath())render()});
      break}
    case 'cmslogin':{
      const pass=$('#cms-pass')?.value||'';
      const msg=$('#cms-msg');
      if(!pass){if(msg)msg.textContent='请输入管理员密码';break}
      el.disabled=true;if(msg)msg.textContent='正在登录…';
      fetch('api/cms',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'login',password:pass})})
        .then(r=>r.json().then(j=>({ok:r.ok,j})))
        .then(({ok,j})=>{
          if(!ok||!j.ok)throw new Error(j.error||'登录失败');
          CLOUD.authed=true;CLOUD.error='';
          toast('登录成功，已进入在线管理');render();
        })
        .catch(err=>{
          if(msg)msg.textContent=String(err.message||err);
          el.disabled=false;
        });
      break}
    case 'cmslogout':{
      const d=draftInfo();
      if(d&&!confirm('有 '+d.edits+' 处未发布更改，退出将丢弃这些更改。确定退出吗？'))break;
      fetch('api/cms',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})})
        .catch(()=>{}).finally(async()=>{
          CLOUD.authed=false;clearDraft();
          try{localStorage.removeItem(KEY)}catch(e){}
          go('/');
          await loadSiteManifest(true);render();
        });
      break}
    case 'cmspublish':{publishNow();break}
    case 'cmsdiscard':{
      const d=draftInfo();if(!d)break;
      if(!confirm('放弃这 '+d.edits+' 处未发布更改，恢复到线上版本吗？'))break;
      clearDraft();
      loadSiteManifest(true).then(()=>{render();toast('已放弃草稿，恢复到线上版本')});
      break}
    case 'cmssync':{publishNow();break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-act="icondesigner"]'))setIconDesigner(el.dataset.slug,el.dataset.icon,el.value);
  else if(el.matches('[data-act="icontype"]'))setIconType(el.dataset.slug,el.dataset.icon,el.value);
  else if(el.matches('[data-act="iconstyle"]'))setIconStyle(el.dataset.slug,el.dataset.icon,el.value);
  else if(el.matches('[data-act="icondate"]'))setIconDate(el.dataset.slug,el.dataset.icon,el.value);
  else if(el.matches('[data-act="appdate"]'))setAppDate(el.dataset.slug,el.value);
  else if(el.id==='import-country'){ADMIN.importCountry=el.value;if(ADMIN.importQuery&&!ADMIN.importBusy)doImportSearch()}
  else if(el.id==='app-size'){
    ADMIN.appPageSize=+el.value||10;ADMIN.appPage=1;ADMIN.selectedApps.clear();
    try{localStorage.setItem('iconmuseum_admin_pagesize',String(ADMIN.appPageSize))}catch(e){}
    viewAdminApps();
  }
  else if(el.matches('input.app-check')){
    if(el.checked)ADMIN.selectedApps.add(el.dataset.slug);else ADMIN.selectedApps.delete(el.dataset.slug);
    updateSelectionUI();
  }
  else if(el.id==='app-all'){
    $$('input.app-check').forEach(b=>{b.checked=el.checked;
      if(el.checked)ADMIN.selectedApps.add(b.dataset.slug);else ADMIN.selectedApps.delete(b.dataset.slug)});
    updateSelectionUI();
  }
});
document.addEventListener('keydown',e=>{
  const sec=DB.security||{};
  if(sec.devKeys){
    const k=e.key.toLowerCase();
    const blocked=e.key==='F12'
      ||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))
      ||(e.ctrlKey&&!e.shiftKey&&['u','s'].includes(k))
      ||(e.metaKey&&e.altKey&&['i','j','c'].includes(k));
    if(blocked){e.preventDefault();toast('该操作已被站点安全策略禁用');return}
  }
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target&&e.target.id==='import-q'){e.preventDefault();doImportSearch()}
  if(e.key==='Enter'&&e.target&&e.target.id==='cms-pass'){
    e.preventDefault();document.querySelector('[data-act="cmslogin"]')?.click();
  }
});
if(FILE_MODE)window.addEventListener('hashchange',()=>{
  /* 离线母版用 hash 导航，新条目默认无 state；补一个 d 让「返回上一步」同样可用 */
  try{if(!stateDepth())history.replaceState({d:1,y:0},'')}catch(e){}
  render({scroll:'restore'});
});else window.addEventListener('popstate',()=>render({scroll:'restore'}));
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(route().path==='/'){const g=$('#grid');if(g){g.innerHTML=gridHTML(orderedIcons(route().p),homeTab(route().p));normalizeLinks()}}},180)});

/* ---------- boot ---------- */
applySecurity();render();
(async()=>{
  /* 先探测后端再载入清单：有在线 CMS 时直接读最新数据，纯静态托管则读本地 manifest.json */
  await probeCMS();
  /* 后台渲染单独兜错：本机缓存若因版本升级缺字段导致 render 抛错，
     也不能阻断后面的清单同步（否则旧 base64 缓存永远清不掉）。 */
  /* 探测结束不论成功/失败都要重渲染后台：成功显示登录页，失败显示可重试提示 */
  try{if(isAdminPath())render()}catch(e){}
  await loadSiteManifest();
})();
</script>
